[project]
name = "Hostile fixture — sound <img src=x data-injected onerror=\"document.documentElement.dataset.smokePwned=1\"> & </p>"
format_version = 3

# A deliberately hostile intent graph that is nonetheless VALID.
#
# Every field a reader's browser will be asked to display carries characters
# that close an element, open one, or name a scheme a browser executes. The
# graph is sound under `tl check --strict` all the same, which is the
# whole point: a test that asserts the content is displayed rather than obeyed
# needs the graph around it to be beyond reproach, so that a red run means the
# encoding failed and never that the fixture did.
#
# Nothing here is an attack on anybody. The payloads write one sentinel —
# `document.documentElement.dataset.smokePwned` — which exists so that a test
# can tell "the browser executed this" apart from "the browser displayed the
# words of it", a distinction that checking for the payload's own text cannot
# make.

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ground_link_types = ["implements"]

[types.intent]
attrs.note = { required = false }

[types.system_requirement]
attrs.note = { required = false }

[links]
types = ["implements", "relates"]

[link_rules]
implements = { from = ["system_requirement"], to = ["intent"] }
relates = { from = ["system_requirement"], to = ["system_requirement"] }

# The address is `http`, not `https`, and that is the reason this source is
# here. An editor that links what a repository declared has to decide whether
# the browser will merely fetch the address or act on it, and a fixture whose
# every address is benign cannot tell a live guard from a removed one — the
# assertion passes either way. This one is fetched perfectly well (GitHub
# redirects, and a browser client builds its own https requests from the owner
# and repository names) while remaining an address no reader should be handed
# as a link.
#
# An address carrying a scheme the browser executes is NOT declared here: such
# a graph never opens at all, because the address is parsed as a repository
# before any of the graph is rendered. That case has its own graph in this
# repository, under `unfetchable/`.
[[sources]]
namespace = "medium"
url = "http://github.com/rhodium-org/throughline-medium-web"
ref = "v2026-07"

[status]
values = ["proposed", "draft", "approved", "ratified", "suspect", "rejected", "deleted"]

[status.roles]
initial = "draft"
proposed = "proposed"
ratified = "ratified"
invalidated = "rejected"
suspect = "suspect"
tombstone = "deleted"

[transitions]
proposed = ["draft", "approved", "ratified", "suspect", "rejected", "deleted"]
draft = ["approved", "suspect", "rejected", "deleted"]
approved = ["ratified", "suspect", "rejected", "deleted"]
ratified = ["suspect", "rejected", "deleted"]
suspect = ["approved", "ratified", "rejected", "deleted"]
rejected = ["draft", "deleted"]
