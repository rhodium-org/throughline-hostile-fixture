title: "This requirement points at nothing, on purpose"
text: "The link below names a target that does not exist, so the tools write a finding that quotes the name. The name is the payload. It carries no slash, because a target containing one is an external reference the core deliberately leaves opaque, and an opaque target produces no finding to quote it in."
